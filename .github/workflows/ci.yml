name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        # The tests are offline and import-level. No browser binary is needed,
        # so we deliberately skip `camoufox fetch` / `patchright install`.
        run: uv sync --extra dev

      - name: Lint (ruff)
        # Use the project lockfile so new Ruff releases cannot break CI.
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q
