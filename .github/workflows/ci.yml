name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        # The tests are offline and import-level. No browser binary is needed,
        # so we deliberately skip `camoufox fetch` / `patchright install`.
        run: uv sync --extra dev

      - name: Lint (ruff)
        # Use the project lockfile so new Ruff releases cannot break CI.
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q

  camoufox-macos:
    # macOS keeps Camoufox in an app bundle with a different file layout.
    # Run the browser tests that use only local fixture pages there, because
    # the offline suite cannot launch a browser.
    name: live browser tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Cache Camoufox browser
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/camoufox
          key: camoufox-${{ runner.os }}-${{ runner.arch }}-152.0.4-beta.30

      - name: Fetch pinned Camoufox
        env:
          # Authenticated GitHub API calls avoid the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run camoufox fetch official/152.0.4-beta.30

      - name: Cache patched Chromium
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: patchright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install patched Chromium
        # The handoff test loads a Camoufox session into Chromium. The
        # fingerprint test uses the runner's Google Chrome when it has one.
        run: uv run patchright install chromium

      - name: Live browser tests (local fixtures only)
        env:
          WRAITH_LIVE_TEST: "1"
        run: >-
          uv run pytest -q
          tests/test_live_launch.py
          tests/test_live_frames.py
          tests/test_live_press_hold.py
          tests/test_live_clawd.py
          tests/test_live_secret_policy.py
          tests/test_live_handoff.py
          tests/test_live_domains.py
          tests/test_live_fingerprint.py
          tests/test_live_input_tools.py
